name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        run: |
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($expected)"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$(cat VERSION)" '
            /^## \[/ { p = (index($0, "## [" ver "]") == 1); next }
            p
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes found for $(cat VERSION) in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
