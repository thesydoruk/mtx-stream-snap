name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Shell syntax
        run: for f in install.sh uninstall.sh extras/*.sh tests/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck --severity=warning install.sh uninstall.sh extras/*.sh tests/*.sh

      - name: Python syntax
        run: python -m py_compile scripts/*.py

      - name: VERSION has a CHANGELOG entry
        run: |
          version="$(cat VERSION)"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION must be X.Y.Z, got '$version'"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

  # Installs dependencies with install.sh on each distro (as root, no sudo),
  # then runs MediaMTX + snapfeeder end to end with a synthetic camera
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-12,       image: "debian:12",           runner: ubuntu-24.04 }
          - { name: debian-13,       image: "debian:13",           runner: ubuntu-24.04 }
          - { name: ubuntu-22.04,    image: "ubuntu:22.04",        runner: ubuntu-24.04 }
          - { name: ubuntu-24.04,    image: "ubuntu:24.04",        runner: ubuntu-24.04 }
          - { name: fedora,          image: "fedora:latest",       runner: ubuntu-24.04 }
          - { name: archlinux,       image: "archlinux:latest",    runner: ubuntu-24.04 }
          - { name: opensuse,        image: "opensuse/tumbleweed", runner: ubuntu-24.04 }
          - { name: debian-12-arm64, image: "debian:12",           runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (install.sh --deps-only)
        run: bash install.sh --deps-only

      - name: End-to-end smoke test
        run: VENV_DIR="$PWD/venv" bash tests/smoke_test.sh
